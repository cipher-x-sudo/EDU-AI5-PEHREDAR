tenant: default
thresholds:
  warn: 0.45
  judge_low: 0.30
  block: 0.75
logging:
  store_raw_text: false
  store_hash: true
l2:
  mode: routed
  # non-English path: models/clf_v3_e3 (PEHREDAR_L2_XLMR_DIR); threshold = 2.75% L2-only dev non-English FPR,
  # chosen jointly with the judge policy on dev (results/judge_policy_joint.md)
  xlmr_threshold: 0.9682675
judge:
  # L3 Qwen3Guard: every capped L2 score >= judge_low may reach the judge (floor 0); "unsafe" blocks only for
  # these categories, other unsafe and controversial verdicts warn (results/judge_policy_joint.md)
  xlmr_floor: 0.0
  block_categories: [Jailbreak, PII, Non-violent Illegal Acts, Violent]
