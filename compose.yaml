services:
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_models:/root/.ollama
    environment:
      OLLAMA_MAX_LOADED_MODELS: "2"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

  gateway:
    build:
      context: .
      target: gateway
    env_file:
      - .env
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      PEHREDAR_UPSTREAM_URL: http://ollama:11434/v1
      PEHREDAR_DB_PATH: /state/pehredar.db
      PEHREDAR_POLICY_PATH: /app/config/policy.yaml
      PEHREDAR_GUARD_MODEL: hf.co/QuantFactory/Qwen3Guard-Gen-0.6B-GGUF:Q4_K_M
      PEHREDAR_MODELS_DIR: /app/models
    volumes:
      - ./config:/app/config:ro
      - ./models:/app/models:ro
      - gateway_state:/state
    depends_on:
      - ollama
    restart: unless-stopped

  # Gateway with L2 on GPU (docker compose --profile gpu up gateway-gpu); stop `gateway` first (same port).
  gateway-gpu:
    profiles: [gpu]
    build:
      context: .
      target: gateway-gpu
    env_file:
      - .env
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      PEHREDAR_UPSTREAM_URL: http://ollama:11434/v1
      PEHREDAR_DB_PATH: /state/pehredar.db
      PEHREDAR_POLICY_PATH: /app/config/policy.yaml
      PEHREDAR_GUARD_MODEL: hf.co/QuantFactory/Qwen3Guard-Gen-0.6B-GGUF:Q4_K_M
      PEHREDAR_MODELS_DIR: /app/models
      PEHREDAR_L2: "1"
      PEHREDAR_L2_XLMR_DIR: /app/models/clf_v3_e3
      PEHREDAR_LANGID_MODEL: /app/models/langid_v2.joblib
      HF_HUB_OFFLINE: "1"
    volumes:
      - ./config:/app/config:ro
      - ./models:/app/models:ro
      - ./models/hf_cache:/root/.cache/huggingface:ro
      - gateway_state:/state
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    depends_on:
      - ollama
    restart: unless-stopped

  tests:
    profiles: [test]
    build:
      context: .
      target: tests
    working_dir: /app
    environment:
      PEHREDAR_DB_PATH: /tmp/pehredar.db
    volumes:
      - .:/app:ro
    command: python -m pytest -q -p no:cacheprovider --basetemp=/tmp/pytest

  training:
    profiles: [training]
    build:
      context: .
      target: trainer
    working_dir: /app
    volumes:
      - ./data:/app/data
      - ./scripts:/app/scripts:ro
      - ./models:/app/models
      - ./results:/app/results
      - ./config:/app/config:ro
    environment:
      PEHREDAR_POLICY_PATH: /app/config/policy.yaml
    command: python -m scripts.train_classifier data/processed/train.jsonl models/clf_v1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  dashboard:
    profiles: [dashboard]
    build:
      context: .
      target: dashboard
    ports:
      - "127.0.0.1:8501:8501"
    environment:
      PEHREDAR_DB_PATH: /state/pehredar.db
    volumes:
      - gateway_state:/state:ro

  frontend:
    build:
      context: .
      target: frontend
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      - gateway
    restart: unless-stopped

  data:
    profiles: [data]
    build:
      context: .
      target: data
    working_dir: /app
    env_file:
      - .env
    environment:
      PEHREDAR_POLICY_PATH: /app/config/policy.yaml
      PEHREDAR_DB_PATH: /tmp/pehredar.db
    volumes:
      - ./data:/app/data
      - ./scripts:/app/scripts:ro
      - ./config:/app/config:ro
    command: python -m scripts.download_data

volumes:
  ollama_models:
  gateway_state:
