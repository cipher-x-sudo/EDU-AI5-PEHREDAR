[project]
name = "pehredar"
version = "0.1.0"
description = "Local multilingual LLM firewall foundation"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "httpx>=0.27",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3"]
evaluation = ["pandas>=2.2", "scikit-learn>=1.5"]
classifier = ["torch>=2.5", "transformers>=4.45,<5", "sentencepiece>=0.2"]
training = ["torch>=2.5", "transformers>=4.45,<5", "sentencepiece>=0.2"]
embeddings = ["sentence-transformers==3.3.1", "faiss-cpu==1.9.0.post1"]
dashboard = ["streamlit>=1.40", "pandas>=2.2"]
data = ["huggingface-hub>=0.26", "pyarrow>=18", "pandas>=2.2", "requests>=2.32"]
redteam = ["garak", "pyrit"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["pehredar*"]
